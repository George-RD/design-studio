workflow:
  name: design-studio
  description: >-
    Rooted, resumable multi-agent frontend design. Product framing and implementation may see source;
    visual direction and browser judgement do not. Every build is preserved, mechanical findings are
    current snapshots, and only an accepted final tree becomes authoritative.

  invariants:
    - Visual Director never receives source, selectors, implementation diffs, the unattended seed or assigned candidate index.
    - Evaluator never receives source, implementation effort, full design description, design flags or prior scores.
    - Evaluator reports evidence and scores only; Orchestrator owns REFINE, PIVOT, SHIP, ESCALATE and HALT.
    - Unattended assignment is committed before candidate generation and hidden from Visual Director.
    - Every completed iteration is immutable; events.jsonl is append-only.
    - Mechanical findings are complete current snapshots, not an accumulated open cache.
    - No visual winner is selected without a runnable target and both required browser viewports.
    - No accepted tree is codified until finish/acceptance.json proves its postconditions.
    - Extend preserves incumbent global authority, never pivots, and emits reusable deltas only as proposals after accepted surface proof.
    - No agent self-commits; version-control actions belong to the calling harness or user.

  capabilities:
    required: [file_io, shell, isolated_subagents]
    visualDecision: [runnable_target, browser_automation]
    optional: [business_copy_style, image_generation, structured_user_questions, version_control]

  defaults:
    budgetClass: standard
    iterationBudgets: { quick: 2, standard: 4, ambitious: 6 }
    explicitBudgetMinimum: 1
    explicitBudgetMaximum: 8
    pivotBudget: { quick: 0, standard: 1, ambitious: 2, explicit: 1 }
    shipFloor: { designQuality: 7, originality: 7, craft: 7, functionality: 7 }
    viewports: { desktop: [1440, 900], mobile: [390, 844] }
    finishCorrectionRounds: 1
    directionCount: 3

  modePolicies:
    extend:
      procedure: references/extend.md
      pivotBudget: 0
      candidateCount: { default: 1, maximum: 3 }
      preservedAuthorities: [design, designDna, tokens, designSystemSkill]
      completion:
        preserve:
          publicationState: unchanged
          outputs: [compatibilitySite, extensionResult]
        extend:
          publicationState: proposed-only
          outputs: [compatibilitySite, extensionResult, proposedSystemDelta]

  paths:
    runRoot: harness-output/runs/{runId}
    runManifest: harness-output/runs/{runId}/run.json
    roots: harness-output/runs/{runId}/roots.json
    capabilities: harness-output/runs/{runId}/capabilities.json
    events: harness-output/runs/{runId}/events.jsonl
    product: PRODUCT.md
    design: DESIGN.md
    copy: COPY.md
    spec: harness-output/runs/{runId}/spec.md
    sprintContract: harness-output/runs/{runId}/sprint-contract.md
    surfaceBrief: harness-output/runs/{runId}/surface-brief.md
    baseline: harness-output/runs/{runId}/baseline/
    designIntent: harness-output/runs/{runId}/design-intent.json
    extensionScope: harness-output/runs/{runId}/extension/scope.json
    extensionAuthorityManifest: harness-output/runs/{runId}/extension/authority-manifest.json
    extensionVisualConstraints: harness-output/runs/{runId}/extension/visual-constraints.md
    extensionConstraintEvidence: harness-output/runs/{runId}/iterations/{N}/extension-constraints.json
    extensionResult: harness-output/runs/{runId}/finish/extension-result.json
    proposedSystemDelta: harness-output/runs/{runId}/finish/proposed-system-delta.json
    extensionEscalation: harness-output/runs/{runId}/extension/escalation.json
    nextDesignIntent: harness-output/runs/{runId}/extension/next-design-intent.json
    scores: harness-output/runs/{runId}/scores.json
    iterationRoot: harness-output/runs/{runId}/iterations/{N}
    directionAssignment: harness-output/runs/{runId}/iterations/{N}/direction/direction-assignment.json
    directions: harness-output/runs/{runId}/iterations/{N}/direction/directions.md
    directionSelection: harness-output/runs/{runId}/iterations/{N}/direction/direction-selection.json
    selectedDirection: harness-output/runs/{runId}/iterations/{N}/direction/selected-direction.md
    designDescription: harness-output/runs/{runId}/iterations/{N}/direction/design-description.md
    site: harness-output/runs/{runId}/iterations/{N}/site/
    serveConfig: harness-output/runs/{runId}/iterations/{N}/serve.json
    designFlags: harness-output/runs/{runId}/iterations/{N}/design-flags.json
    mechanicalFindings: harness-output/runs/{runId}/iterations/{N}/mechanical-findings.json
    screenshots: harness-output/runs/{runId}/iterations/{N}/screenshots/
    observation: harness-output/runs/{runId}/iterations/{N}/observation.json
    critique: harness-output/runs/{runId}/iterations/{N}/critique.md
    finishRoot: harness-output/runs/{runId}/finish/
    finishSelection: harness-output/runs/{runId}/finish/selection.json
    finishSelectedSite: harness-output/runs/{runId}/finish/selected-site/
    finishSelectedServeConfig: harness-output/runs/{runId}/finish/selected-serve.json
    finishSelectedDirection: harness-output/runs/{runId}/finish/selected-direction.md
    finishCorrectedSite: harness-output/runs/{runId}/finish/corrected-site/
    finishCorrectedServeConfig: harness-output/runs/{runId}/finish/corrected-serve.json
    finishFinalTree: harness-output/runs/{runId}/finish/final-tree.json
    finishAcceptance: harness-output/runs/{runId}/finish/acceptance.json
    compatibilitySite: harness-output/site/
    designDna: harness-output/design-system/design-dna.md
    tokens: harness-output/design-system/tokens.css
    designSystemSkill: harness-output/design-system/skill/
    report: harness-output/report.md

  schemas:
    runManifest:
      type: object
      required: [runId, promptHash, status, mode, budgetClass, iterationBudget, pivotBudget, currentIteration, pivotsUsed, correctionRoundsUsed, currentStep]
      properties:
        status: { enum: [initialising, running, halted, complete] }
        mode: { enum: [greenfield, overhaul, extend] }
        designIntentPath: { type: string }
        budgetClass: { enum: [quick, standard, ambitious, explicit] }
        iterationBudget: { type: integer, minimum: 1, maximum: 8 }
        currentIteration: { type: integer, minimum: 1 }
        finalStatus: { enum: [pending, quality-floor-met, best_available, complete-with-open-items, halted] }

    roots:
      type: object
      required: [targetKind, repoRoot, appRoot, contextRoot, evidence]
      properties:
        targetKind: { enum: [local, external-url] }
        evidence: { type: array, minItems: 1 }

    capabilities:
      type: object
      required: [probedAt, evaluationPlan, capabilities]
      properties:
        evaluationPlan: { enum: [full, build-once-unselected, mechanical-review] }
        capabilities: { type: object }

    directionAssignment:
      type: object
      required: [mode, candidateIds, committedBeforeExplore]
      properties:
        mode: { enum: [user-choice, deterministic-seed, pinned-brief, extend-bounded] }
        candidateIds: { type: array, minItems: 1, maxItems: 3 }
        seed: { type: [string, 'null'] }
        assignedIndex: { type: [integer, 'null'], minimum: 1, maximum: 3 }
        committedBeforeExplore: { const: true }

    directionSelection:
      type: object
      required: [selectedId, method, candidateIds, assignmentPath]
      properties:
        method: { enum: [user, deterministic-seed, pinned-brief, extend-bounded] }

    mechanicalFindings:
      type: object
      required: [detector, snapshotId, generatedAt, passes, findings]
      properties:
        detector: { enum: [design-studio, impeccable, fallback] }
        findings: { type: array }

    observation:
      type: object
      required: [iteration, status, actualViewports, interactionEvidence, gateResults, zones, scores, weightedAverage, keyIssues]
      forbidden: [decision, recommendation, trend, bestIteration]
      properties:
        status: { enum: [evaluated, unevaluated] }
        scores: { type: [object, 'null'] }
        weightedAverage: { type: [number, 'null'] }

    acceptance:
      type: object
      required: [status, selectedTree, sourceIteration, treeManifest, serveValidated, mechanicalSnapshotId, viewportEvidence, iterationIntegrity]
      properties:
        status: { enum: [accepted, rejected] }
        serveValidated: { type: boolean }
        iterationIntegrity: { type: boolean }

    extensionScope:
      type: object
      required: [designIntentPath, acceptedAuthorityPath, authorityRevision, acceptanceProvenance, surfaceScope, requestedSystemEffect, candidateCount, localQuestion]
      properties:
        requestedSystemEffect: { enum: [preserve, extend] }
        candidateCount: { type: integer, minimum: 1, maximum: 3 }
        localQuestion: { type: [string, 'null'] }

    extensionAuthorityManifest:
      type: object
      required: [authorityRevision, entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [path, kind, sha256, members]
            properties:
              path: { type: string }
              kind: { enum: [file, directory, absent] }
              sha256: { type: [string, 'null'] }
              members: { type: array }

    extensionConstraintEvidence:
      type: object
      required: [status, evidence, violations]
      properties:
        status: { enum: [pass, fail, unverified] }
        evidence: { type: array, minItems: 1 }
        violations: { type: array }

    extensionResult:
      type: object
      required: [status, requestedSystemEffect, systemEffect, authorityBefore, authorityAfter, authorityUnchanged, publicationState, acceptancePath, proposedSystemDelta, escalationPath]
      properties:
        status: { enum: [accepted, rejected, escalated] }
        requestedSystemEffect: { enum: [preserve, extend] }
        systemEffect: { enum: [preserve, extend, none] }
        authorityUnchanged: { type: [boolean, 'null'] }
        publicationState: { enum: [unchanged, proposed-only] }
        acceptancePath: { type: [string, 'null'] }
        proposedSystemDelta: { type: [string, 'null'] }
        escalationPath: { type: [string, 'null'] }

    proposedSystemDelta:
      type: object
      required: [status, authorityRevision, reusableRule, rationale, acceptancePath, evidence]
      properties:
        status: { const: proposed }
        evidence: { type: array, minItems: 1 }

    extensionEscalation:
      type: object
      required: [reason, evidence, previousDesignIntentPath, nextDesignIntentPath, authorityManifestPath]
      properties:
        reason: { enum: [explicit-user-intent, incompatible-accepted-system] }
        evidence: { type: array, minItems: 1 }

  agents:
    Planner:
      seesSource: true
      owns: [product truth, roots evidence, surface scope, success criteria]
      neverOwns: [aesthetic selection, workflow decision]
    VisualDirector:
      seesSource: false
      seesAssignment: false
      owns: [equally specified candidates within the selected mode, selected source-free visual contract]
      neverOwns: [candidate ranking, implementation, workflow decision]
    Builder:
      seesSource: true
      owns: [implementation, semantics, states, serve contract, fidelity evidence]
      neverOwns: [direction replacement, completed iteration mutation, version-control actions]
    Evaluator:
      seesSource: false
      seesPriorScores: false
      owns: [browser interaction evidence, zone scores, visual critique]
      neverOwns: [implementation advice framed as code, workflow decision]
    Orchestrator:
      seesSource: as-needed
      owns: [roots, capabilities, event journal, assignment, workflow decisions, final selection, acceptance, codification]

  steps:
    - id: initialise
      agent: Orchestrator
      inputs: [design_intent, user_prompt, existing_target, overhaul_goals, budget_override, optional_run_id]
      actions:
        - Generate runId from timestamp plus prompt hash unless an explicit run ID is supplied.
        - For a new run, create the run root, run.json, empty scores.json and append an initialise completed event.
        - For a new run, persist the validated design_intent unchanged and record designIntentPath in run.json; map create to internal greenfield mode and retain overhaul or extend directly.
        - On resume, load the persisted intent without overwriting it and compare the supplied intent before any mutation; a changed intent requires a new run.
        - Clamp explicit build budgets to 1 through 8 and record the matching pivot budget.
        - In extend mode apply modePolicies.extend after all budget overrides; pivotBudget is always zero.
      outputs: [designIntent, runManifest, scores, events]
      next: resume_validate

    - id: resume_validate
      agent: Orchestrator
      inputs: [designIntent, runManifest, events, extensionAuthorityManifest when extend]
      procedure: references/runtime-integrity.md
      actions:
        - For a new run, append a no-op completion receipt and continue.
        - For a resumed run, validate prompt hash, roots, capabilities, event order, completed artifacts and iteration immutability.
        - For extend, compare the persisted intent and any completed authority manifest to current files before reusing evidence; changed authority blocks resume without rollback or implicit recodification.
        - Continue from the first step without a valid completed receipt; never rerun a completed build in the same iteration.
      next: resolve_roots

    - id: resolve_roots
      agent: Orchestrator
      procedure: references/runtime-integrity.md
      actions:
        - Resolve repoRoot, appRoot and contextRoot from explicit target, serve contract, framework configuration, routes and repository evidence.
        - Write roots.json with target kind and evidence; do not use package-manager naming as sole proof.
      outputs: [roots]
      next: probe_capabilities

    - id: probe_capabilities
      agent: Orchestrator
      procedure: references/runtime-integrity.md
      actions:
        - Probe required and optional tools and write evidence for every capability.
        - Set evaluationPlan full only when the target can run and both browser viewports can be attempted.
        - When Studio cannot make a visual decision, set build-once-unselected and clamp iterationBudget to 1.
      outputs: [capabilities, runManifest]
      next: plan

    - id: plan
      agent: Planner
      inputs: [user_prompt, roots, capabilities, PRODUCT.md, optional COPY.md, optional DESIGN.md, repository evidence]
      actions:
        - Inspect before asking; confirm only material gaps.
        - Create or update durable product truth without inventing claims.
        - Classify the surface as persuade, operate, read or experience.
        - Write spec.md, sprint-contract.md and surface-brief.md with preservation constraints, proof and copy baseline when text changes.
      outputs: [product, spec, sprintContract, surfaceBrief]
      next: extension_preflight

    - id: extension_preflight
      agent: Orchestrator
      when: mode == extend
      procedure: references/extend.md
      inputs: [designIntent, roots, capabilities, surfaceBrief, accepted DESIGN.md, linked design-system authorities]
      actions:
        - Verify current project scope and acceptance provenance; missing or conflicting authority blocks extension rather than falling back to greenfield.
        - Freeze every governed authority file and absent output in extensionAuthorityManifest before any build; keep raw source/token material with source-aware roles only.
        - Record the requested local scope and systemEffect; create a source-free projection of the accepted thesis, token roles, component/control grammar, responsive logic and anti-goals.
        - Capture baseline renders and interactions for the extension target; record unavailable evidence without fabricating it.
        - Use one local candidate by default; allow two or three only with a recorded local design question, never replacement worlds.
      outputs: [extensionScope, extensionAuthorityManifest, extensionVisualConstraints, baseline]
      branches:
        - { when: accepted authority is missing or stale or conflicting, next: halt }
        - { when: explicit user intent or recorded incompatibility evidence requires a new Design Intent, next: escalate_extension }
        - { when: authority scope and provenance verified and manifest and visual constraints complete, next: baseline }
        - { when: default, next: halt }
      otherwise: baseline

    - id: baseline
      agent: Orchestrator
      when: mode == overhaul
      procedure: references/overhaul.md
      actions:
        - Serve the incumbent from appRoot and capture verified desktop and mobile renders plus interaction notes.
        - Record capture limits instead of fabricating evidence.
      outputs: [baseline]
      next: prepare_direction_assignment
      otherwise: prepare_direction_assignment

    - id: prepare_direction_assignment
      agent: Orchestrator
      procedure: references/runtime-integrity.md
      actions:
        - Fix candidate IDs before candidate generation using the selected mode's candidate count.
        - For unattended work, derive and record a stable seed and assignedIndex before directions.md exists.
        - For user choice, record null seed and index; for an exact pinned direction, record one candidate and index 1.
        - For extend, record extend-bounded with one candidate by default or the justified local candidate count from extensionScope; a sole candidate uses index 1, multiple candidates use user choice or a precommitted index within that count.
        - Exclude assignment seed and index from Visual Director context.
      outputs: [directionAssignment]
      branches:
        - { when: mode == extend, next: explore_extension }
        - { when: default, next: explore_direction }

    - id: explore_extension
      agent: VisualDirector
      inputs: [product, copy constraints, sprintContract, surfaceBrief, extensionVisualConstraints, baseline screenshots, candidate IDs and local question]
      explicitlyExcluded: [source, raw design-system files, extensionAuthorityManifest, assignment seed and index, implementation effort, prior scores]
      procedure: references/extend.md
      actions:
        - Produce the declared candidates inside the accepted world, preserving all inherited visual constraints.
        - Bound alternatives to the recorded local question; report incompatible constraints as evidence rather than selecting a replacement world.
        - Keep candidates equally specified and unranked; Orchestrator owns selection.
      outputs: [directions]
      next: check_extension_direction

    - id: check_extension_direction
      agent: Orchestrator
      inputs: [directions, extensionScope, extensionVisualConstraints, incompatibility evidence]
      branches:
        - { when: explicit user intent or recorded incompatibility evidence requires a new Design Intent, next: escalate_extension }
        - { when: declared candidate set is complete and every candidate preserves accepted constraints, next: select_direction }
        - { when: default, next: halt }

    - id: explore_direction
      agent: VisualDirector
      when: directionAssignment.mode != pinned-brief
      inputs: [product, copy constraints, spec, sprintContract, surfaceBrief, baseline screenshots, rejected direction summaries on pivot]
      procedure: agents/design-agent.md
      actions:
        - Produce exactly direction-1, direction-2 and direction-3 as equally detailed, viable and materially different candidates.
        - Do not rank, recommend or infer the hidden assignment.
      outputs: [directions]
      next: select_direction
      otherwise: select_direction

    - id: select_direction
      agent: Orchestrator
      inputs: [directionAssignment, optional directions, optional user answer, exact pinned direction, extensionVisualConstraints when extend]
      actions:
        - User choice selects the explicit answer; deterministic selection uses the precommitted index; pinned brief selects its sole candidate.
        - Extend-bounded selects its sole candidate without a tournament, or uses explicit user choice/precommitted index for the justified local set; selection cannot relax accepted constraints.
        - Write direction-selection.json and selected-direction.md with source-free thesis, viewport, path, grammar, responsive intent, signature moment, risk and anti-goals.
      outputs: [directionSelection, selectedDirection]
      next: direct

    - id: direct
      agent: VisualDirector
      inputs: [selectedDirection, product, copy constraints, sprintContract, surfaceBrief, extensionVisualConstraints when extend, current screenshots and visual-only critique on REFINE]
      actions:
        - Expand the selected candidate into design-description.md using visual and experiential language only.
        - On REFINE preserve the world; fix observed experience without replacing the thesis.
      outputs: [designDescription]
      next: build

    - id: build
      agent: Builder
      inputs: [roots, designDescription, spec, sprintContract, surfaceBrief, accepted design-system authorities when extend, source substrate or previous iteration on REFINE]
      procedure: references/generation.md
      actions:
        - Implement only in the current immutable iteration tree.
        - Preserve product facts, claim boundaries and working behaviour; add required semantics, states, responsiveness and reduced motion.
        - Validate serve.json from appRoot and record every material instruction in design-flags.json.
      outputs: [site, serveConfig, designFlags]
      next: mechanical_preflight

    - id: mechanical_preflight
      agent: Orchestrator
      inputs: [roots, capabilities, site, serveConfig, DESIGN.md, pinned brief]
      procedure: references/quality-gates.md
      actions:
        - Collect current source facts and browser facts through the host capabilities; record unavailable evidence as incomplete passes with exact reasons.
        - Run the installed local mechanical runtime and write a complete current snapshot with stable signatures. Previous open findings do not remain open when absent.
        - Resolve primary findings through fixes or exact authority-backed waivers; incomplete evidence never becomes a clean pass.
      outputs: [mechanicalFindings]
      branches:
        - when: capabilities.evaluationPlan == build-once-unselected
          next: halt_unverified
        - when: default
          next: evaluate

    - id: halt_unverified
      agent: Orchestrator
      actions:
        - Preserve the single build and current mechanical snapshot.
        - Set finalStatus halted and terminationReason browser-unavailable.
        - For extend, record a rejected extensionResult with systemEffect none and null acceptance/delta; retain available authority evidence without publishing global files.
        - Do not select a winner, fabricate scores or codify a visual system.
      termination: halted

    - id: evaluate
      agent: Evaluator
      inputs: [live URL, product purpose, audience, surface success criteria, extensionVisualConstraints when extend, current mechanical summary]
      explicitlyExcluded: [source, raw design-system files, extensionAuthorityManifest, designDescription, designFlags, selectedDirection, assignment, prior observations, prior scores, implementation effort]
      procedure: agents/evaluator.md
      actions:
        - Verify actual 1440x900 and 390x844 viewport widths, test meaningful controls and states, and capture browser evidence.
        - Write evaluated observation and critique, or an unevaluated observation with null scores and exact limitation.
        - For extend, test the addition and surrounding existing surfaces against inherited constraints; write extensionConstraintEvidence with pass, fail or unverified and current rendered evidence or exact limitations. Material violations are acceptance blockers, not originality-driven redesign requests.
      outputs: [screenshots, observation, critique, extensionConstraintEvidence]
      next: decide

    - id: decide
      agent: Orchestrator
      inputs: [observation, mechanicalFindings, scoreHistory, runManifest, directionSelection, extensionScope and escalation evidence when extend]
      orderedDecisionTable:
        - { when: browser evaluation incomplete or either required viewport missing, decision: HALT, terminationReason: browser-unavailable }
        - { when: server or iteration artifacts invalid, decision: HALT, terminationReason: invalid-artifact }
        - { when: mode == extend and (explicit user intent or recorded incompatibility evidence) requires a new Design Intent, decision: ESCALATE, terminationReason: accepted-world-incompatible }
        - { when: mode == extend and accepted-world constraints do not pass and N < iterationBudget, decision: REFINE, terminationReason: restore-accepted-world }
        - { when: no open primary finding and every score meets shipFloor and (mode != extend or accepted-world constraints pass), decision: SHIP, terminationReason: quality-floor-met }
        - { when: open primary findings and N < iterationBudget, decision: REFINE, terminationReason: continue-current-direction }
        - { when: mode != extend and originality <= 4 and selection is not pinned and pivots remain and N < iterationBudget, decision: PIVOT, terminationReason: replace-direction }
        - { when: mode != extend and originality stayed below 6 within 0.5 for two evaluated iterations and pivots remain and N < iterationBudget, decision: PIVOT, terminationReason: replace-direction }
        - { when: N >= iterationBudget, decision: SHIP, terminationReason: budget-exhausted }
        - { when: default, decision: REFINE, terminationReason: continue-current-direction }
      actions:
        - Append observation summary and decision as separate evidence records; recompute best iteration by the final tier rules.
      transitions: { REFINE: prepare_refine_iteration, PIVOT: prepare_pivot_iteration, SHIP: finish_select, ESCALATE: escalate_extension, HALT: halt }

    - id: escalate_extension
      agent: Orchestrator
      procedure: references/extend.md
      actions:
        - Require explicit user intent or recorded incompatibility evidence identifying the accepted constraint and unmet requirement; low scores or builder preference alone are insufficient.
        - Write a new Design Intent through validate_design_intent; use overhaul while incumbent authority governs, or create only for a separately scoped new world with no governing visual authority.
        - Keep the original Design Intent, run mode and incumbent authority unchanged; link both decisions and the evidence in extensionEscalation.
        - Record extensionResult as escalated with systemEffect none, no accepted surface or proposed delta, and the observed authority manifests; append the halt event with the new intent handoff.
        - A subsequent run starts from the new validated intent; this run never continues into global codification or publishes a compatibility site.
      outputs: [extensionEscalation, nextDesignIntent, extensionResult, runManifest, events]
      termination: halted

    - id: prepare_refine_iteration
      agent: Orchestrator
      actions:
        - Increment the iteration and create a new tree without modifying the completed one.
        - Copy assignment, candidate set, selection and selected direction unchanged; pass screenshots and visual-only critique to direct.
      next: direct

    - id: prepare_pivot_iteration
      agent: Orchestrator
      actions:
        - Reject this operation for extend; only explicit escalation may reopen its world.
        - Increment iteration and pivotsUsed; preserve rejected direction summary, scores and visual lessons.
        - Do not copy the rejected assignment or selection into the new iteration.
      next: prepare_direction_assignment

    - id: finish_select
      agent: Orchestrator
      inputs: [evaluated immutable iterations, mechanical snapshots, extensionConstraintEvidence when extend]
      actions:
        - For extend, first exclude every iteration whose inherited constraints did not pass from all selection tiers; if none remain, halt without winner or compatibility publication.
        - Tier 1 contains evaluated, mechanically clean iterations meeting every ship floor.
        - Tier 2 contains evaluated, mechanically clean iterations. Otherwise use all evaluated immutable iterations and label best_available.
        - Within the active tier rank by weighted average, minimum criterion, functionality, then latest iteration.
        - Copy the selected site, rewritten serve contract and its own selected-direction.md into finish; recapture both viewports.
      outputs: [finishSelection, finishSelectedSite, finishSelectedServeConfig, finishSelectedDirection]
      next: finish_review

    - id: finish_review
      agent: Evaluator
      freshContext: true
      inputs: [original prompt, confirmed purpose and constraints, surface brief, finish selected direction, extensionVisualConstraints when extend, live selected build, fresh screenshots, current mechanical summary]
      explicitlyExcluded: [source, raw design-system files, extensionAuthorityManifest, full designDescription, prior scores, prior critiques, implementation history]
      actions:
        - Return pass or hold with only material defects in comprehension, usability, responsive integrity, accessibility, coherence or direction fidelity.
      outputs: [finish/verdict.json, finish/critique.md]
      next: finish_correct_or_finalise

    - id: finish_correct_or_finalise
      agent: Orchestrator
      branches:
        - { when: verdict is pass or material findings empty, next: finalise }
        - { when: verdict is hold and correction rounds remain, next: finish_fix }
        - { when: default, next: finalise_with_open_items }

    - id: finish_fix
      agent: Builder
      actions:
        - Copy selected-site to corrected-site before editing and rewrite corrected-serve.json to the corrected tree.
        - Apply one grouped correction batch without changing direction.
        - Validate the corrected server, rerun a full current mechanical snapshot and recapture both viewports.
        - Ask a fresh Evaluator to classify each original finding, rescore all criteria and state material regression; null all comparison fields when either viewport is missing.
        - For extend, carry the same source-free inherited constraints into correction review; corrections cannot change global authority or reopen direction.
      outputs: [finishCorrectedSite, finishCorrectedServeConfig, finish/corrected-mechanical-findings.json, finish/correction-verdict.json]
      next: finish_correction_decide

    - id: finish_correction_decide
      agent: Orchestrator
      branches:
        - when: all original findings resolved, corrected snapshot clean, both viewports verified, no material regression and required floors preserved
          next: finalise
        - when: default
          next: finalise_with_open_items
      actions:
        - Write final-tree.json naming corrected-site only when the full acceptance rule passes; otherwise retain selected-site.

    - id: finalise_with_open_items
      agent: Orchestrator
      actions:
        - Preserve unresolved finish findings and rejected correction evidence.
        - Set finalStatus complete-with-open-items and retain selected-site when correction was not accepted.
      next: finalise

    - id: finalise
      agent: Orchestrator
      actions:
        - Validate final-tree.json or default to selected-site; never choose corrected-site from directory existence.
        - Record final status from selection tier and accepted correction evidence, without copying to compatibilitySite yet.
      next: accept

    - id: accept
      agent: Orchestrator
      inputs: [final tree and finish evidence, extensionConstraintEvidence when extend, extensionAuthorityManifest when extend]
      procedure: references/runtime-integrity.md
      actions:
        - Verify final-tree agreement, source iteration, rewritten serve contract, measured viewports, current mechanical snapshot, open-item status, deterministic tree manifest and iteration immutability.
        - For extend, also verify authority manifests including absent outputs and directory membership are unchanged, fresh finish evidence for the final selected or corrected tree confirms inherited constraints pass, and the accepted surface does not mutate shared token roles or grammar.
        - Record the actual accepted systemEffect for extend in finishAcceptance; preserve or extend must agree with the validated intent and accepted scope, never broaden an unapproved local request.
        - Write finish/acceptance.json as accepted only when every postcondition passes; a high score or exhausted budget never waives extension authority integrity.
      outputs: [finishAcceptance]
      branches:
        - { when: acceptance.status == accepted and mode == extend, next: complete_extension }
        - { when: mode == extend, next: reject_extension }
        - { when: acceptance.status == accepted, next: codify }
        - { when: default, next: halt }

    - id: complete_extension
      agent: Orchestrator
      procedure: references/extend.md
      inputs: [designIntent, extensionScope, extensionAuthorityManifest, finishAcceptance, accepted final tree]
      actions:
        - Require accepted final-tree proof and unchanged authority immediately before publication; failure routes to reject_extension without overwriting concurrent authority changes.
        - Replace harness-output/site only from that accepted final tree; leave DESIGN.md, design DNA, canonical tokens and generated design-system skill unchanged.
        - Follow modePolicies.extend.completion for the accepted effect. For systemEffect preserve, write extensionResult with publicationState unchanged and null proposedSystemDelta.
        - For systemEffect extend, write a proposed reusable delta tied to the accepted surface and incumbent authority revision, then extensionResult with publicationState proposed-only; never apply the delta here.
        - Record requested effect, accepted surface effect, before/after authority manifests and acceptance provenance; applying reusable deltas is the separately acceptance-controlled lifecycle boundary.
      outputs: [compatibilitySite, extensionResult, proposedSystemDelta]
      next: report

    - id: reject_extension
      agent: Orchestrator
      procedure: references/extend.md
      actions:
        - Record extensionResult as rejected with systemEffect none, unchanged publication state and no proposedSystemDelta; retain the failed acceptance evidence and observed before/after authority manifests.
        - Publish no surface or system authority; preserve incumbent files and do not roll back concurrent changes.
      outputs: [extensionResult]
      next: halt

    - id: codify
      agent: Orchestrator
      actions:
        - Replace harness-output/site only from the accepted final tree.
        - Ask Visual Director for design DNA from final screenshots and the selected source-free contract.
        - Ask Builder for canonical tokens from final source; write or update DESIGN.md with accepted provenance.
      outputs: [compatibilitySite, designDna, tokens, designSystemSkill, DESIGN.md]
      next: report

    - id: report
      agent: Orchestrator
      actions:
        - Write report.md with roots, capabilities, assumptions, assignment, iteration history, decisions, selection, finish verdict, acceptance, open items and design-system outputs.
        - For extend, report extensionResult and distinguish accepted local surface from unchanged global authority and any unapplied reusable proposal.
        - Set run status complete, append the final completion event and record final paths.
      outputs: [report, runManifest, events]
      termination: complete

    - id: halt
      agent: Orchestrator
      actions:
        - Preserve all completed artifacts, append the exact failed contract and set finalStatus halted.
        - For extend, write a rejected extensionResult when no result exists, with systemEffect none, no accepted surface or proposed delta and the available authority observations; unknown authority integrity is null, never true.
        - Do not invent a visual score, winner or accepted tree.
      termination: halted
