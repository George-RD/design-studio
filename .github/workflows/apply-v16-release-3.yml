name: Apply v1.6 release contraction valid

on:
  push:
    branches:
      - agent/v16-portable-release-proof

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: agent/v16-portable-release-proof
          fetch-depth: 0

      - name: Apply release edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          def replace(path, old, new, count=None):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:80]!r}")
              if count is not None and text.count(old) != count:
                  raise SystemExit(f"expected {count} occurrences in {path}, found {text.count(old)}")
              target.write_text(text.replace(old, new), encoding="utf-8")
          replace("skills/design-studio/SKILL.md", "version: 1.5.0", "version: 1.6.0", 1)
          replace("skills/design-studio/workflow.yaml", "version: 1.5.0", "version: 1.6.0", 1)
          replace("skills/design-studio/evals/evals.json", "1.5.0", "1.6.0")
          replace(".claude-plugin/plugin.json", '"version": "1.5.0"', '"version": "1.6.0"', 1)
          replace(".claude-plugin/marketplace.json", '"version": "1.5.0"', '"version": "1.6.0"', 1)
          replace(".github/workflows/validate.yml", "versions != {'1.5.0'}", "versions != {'1.6.0'}", 1)
          install_path = Path(".github/workflows/validate-agent-skill-install.yml")
          install = install_path.read_text(encoding="utf-8")
          install = install.replace("  clean-install:\n    runs-on: ubuntu-latest", "  clean-install:\n    strategy:\n      fail-fast: false\n      matrix:\n        agent: [codex, claude-code]\n    runs-on: ubuntu-latest", 1)
          matrix_token = "$" + "{{ matrix.agent }}"
          install = install.replace("--agent codex", f'--agent "{matrix_token}"', 1)
          if "agent: [codex, claude-code]" not in install or f'--agent "{matrix_token}"' not in install:
              raise SystemExit("cross-host install matrix edit failed")
          install_path.write_text(install, encoding="utf-8")
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = readme.index("## Current compatibility and v1.6 direction")
          end = readme.index("\n## Requirements", start)
          readme_block = base64.b64decode("").decode()
          readme_path.write_text(readme[:start] + readme_block + readme[end:], encoding="utf-8")
          portable_path = Path("test/test_portable_product_migration_map.py")
          portable = portable_path.read_text(encoding="utf-8")
          portable = portable.replace('RETIRED_POST_BASELINE_AUTHORITIES = {\n    "skills/design-studio/references/planning.md",\n    "skills/design-studio/references/evaluation.md",\n    "skills/design-studio/references/iteration.md",\n}\n', 'RETIRED_POST_BASELINE_AUTHORITIES = {\n    "skills/design-studio/references/planning.md",\n    "skills/design-studio/references/evaluation.md",\n    "skills/design-studio/references/iteration.md",\n}\nRETIRED_POST_BASELINE_SURFACES = {"references/methodology.md"}\n', 1)
          portable = portable.replace('                self.assertTrue((ROOT / row["path"]).exists())\n', '                if row["path"] in RETIRED_POST_BASELINE_SURFACES:\n                    self.assertFalse((ROOT / row["path"]).exists())\n                else:\n                    self.assertTrue((ROOT / row["path"]).exists())\n', 1)
          if "RETIRED_POST_BASELINE_SURFACES" not in portable:
              raise SystemExit("portable migration test edit failed")
          portable_path.write_text(portable, encoding="utf-8")
          ownership_path = Path("test/test_milestone_0_ownership_inventory.py")
          ownership = ownership_path.read_text(encoding="utf-8")
          ownership = ownership.replace('RETIRED_POST_BASELINE_REFERENCES = {\n    "skills/design-studio/references/planning.md",\n', 'RETIRED_POST_BASELINE_REFERENCES = {\n    "references/methodology.md",\n    "skills/design-studio/references/planning.md",\n', 1)
          ownership_path.write_text(ownership, encoding="utf-8")
          release_test_path = Path("test/test_v16_release_contract.py")
          release_test = release_test_path.read_text(encoding="utf-8")
          release_test = release_test.replace('        self.assertEqual(VERSION, marketplace_plugin["version"])\n', '        self.assertEqual(VERSION, marketplace_plugin["version"])\n\n        evals = json.loads(self.read("skills/design-studio/evals/evals.json"))\n        workflow = self.read("skills/design-studio/workflow.yaml")\n        self.assertEqual(VERSION, evals["version"])\n        self.assertRegex(workflow, rf"(?m)^  version: {re.escape(VERSION)}$")\n', 1)
          release_test_path.write_text(release_test, encoding="utf-8")
          release_dir = Path("docs/releases")
          release_dir.mkdir(parents=True, exist_ok=True)
          release_record = base64.b64decode("").decode()
          (release_dir / "v1.6.0.md").write_text(release_record, encoding="utf-8")
          roadmap_path = Path("ROADMAP.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap = roadmap.replace('### Next ready roadmap item\n\n- [#53 — Prove the portable v1.6 path and contract legacy surfaces](https://github.com/George-RD/design-studio/issues/53) — #48 and #52 are complete, so final portable-path and legacy-surface proof is next in milestone order.', '### Portable v1.6 complete\n\n- [#53 — Prove the portable v1.6 path and contract legacy surfaces](https://github.com/George-RD/design-studio/issues/53) — complete; two-host install, cross-platform runtime, local method authority, optional composition, thin adapters and legacy contraction are recorded in [`docs/releases/v1.6.0.md`](docs/releases/v1.6.0.md).', 1)
          roadmap = roadmap.replace('- [#53 — Prove the portable v1.6 path and contract legacy surfaces](https://github.com/George-RD/design-studio/issues/53) — next in milestone order', '- [#53 — Prove the portable v1.6 path and contract legacy surfaces](https://github.com/George-RD/design-studio/issues/53) — complete; v1.6 acceptance evidence is recorded in [`docs/releases/v1.6.0.md`](docs/releases/v1.6.0.md)', 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")
          Path("references/methodology.md").unlink()
          for helper in ("apply-v16-release.yml", "apply-v16-release-2.yml", "apply-v16-release-3.yml"):
              Path(".github/workflows", helper).unlink()
          PY

      - name: Commit release implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: establish portable v1.6 boundary"
          git push origin HEAD:agent/v16-portable-release-proof
