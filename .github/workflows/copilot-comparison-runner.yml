name: Validate Copilot comparison runner

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_copilot_comparison.py"
      - "scripts/run_copilot_comparison_lane.py"
      - "scripts/run_copilot_comparison_matrix_generation.py"
      - "test/test_copilot_comparison_runner.py"
      - "test/test_copilot_comparison_lane.py"
      - "test/test_copilot_comparison_matrix_generation.py"
      - "test/test_copilot_comparison_workflow_dependencies.py"
      - ".github/workflows/copilot-comparison-runner.yml"
      - ".github/workflows/milestone-0-comparison-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate comparison runner contract
        run: |
          set -euo pipefail
          python3 -m unittest discover -s test -p 'test_copilot_comparison*.py' -v
          python3 -m py_compile \
            scripts/run_copilot_comparison.py \
            scripts/run_copilot_comparison_lane.py \
            scripts/run_copilot_comparison_matrix_generation.py
