name: Impeccable exact audit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  impeccable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json

      - name: Start documentation server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs > /tmp/design-studio-docs.log 2>&1 &
          echo $! > /tmp/design-studio-docs.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/design-studio-docs.log
          exit 1

      - name: Run exact Impeccable source and viewport scans
        shell: bash
        run: |
          set -uo pipefail
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome_path" ]; then
            export PUPPETEER_EXECUTABLE_PATH="$chrome_path"
          fi

          set +e
          npx -y impeccable@latest detect --json docs/index.html > /tmp/impeccable-source.json
          source_status=$?
          npx -y impeccable@latest detect --json --viewport 1440x900 http://127.0.0.1:4173/ > /tmp/impeccable-desktop.json
          desktop_status=$?
          npx -y impeccable@latest detect --json --viewport 390x844 http://127.0.0.1:4173/ > /tmp/impeccable-mobile.json
          mobile_status=$?
          set -e

          python - "$source_status" "$desktop_status" "$mobile_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          statuses = {
              'source': int(sys.argv[1]),
              'desktop 1440×900': int(sys.argv[2]),
              'mobile 390×844': int(sys.argv[3]),
          }
          files = {
              'source': Path('/tmp/impeccable-source.json'),
              'desktop 1440×900': Path('/tmp/impeccable-desktop.json'),
              'mobile 390×844': Path('/tmp/impeccable-mobile.json'),
          }

          all_rows = []
          details = []
          overall_failed = False

          def clean(value):
              return str(value or '').replace('|', '\\|').replace('\n', ' ').strip()

          for label, status in statuses.items():
              path = files[label]
              try:
                  findings = json.loads(path.read_text())
                  if not isinstance(findings, list):
                      raise TypeError(f'expected a JSON array, got {type(findings).__name__}')
              except Exception as exc:
                  findings = []
                  overall_failed = True
                  details.append(f'- **{label}: detector output could not be parsed:** `{clean(exc)}`')

              primary = [finding for finding in findings if not finding.get('advisory')]
              advisory = [finding for finding in findings if finding.get('advisory')]
              all_rows.append((label, status, len(primary), len(advisory)))
              if status != 0 or primary:
                  overall_failed = True

              for finding in findings:
                  severity = 'Advisory' if finding.get('advisory') else 'Primary'
                  location = clean(finding.get('file', '<render>'))
                  if finding.get('line'):
                      location += f":{finding['line']}"
                  rule = clean(finding.get('antipattern', 'unknown'))
                  description = clean(finding.get('description', ''))
                  snippet = clean(finding.get('snippet', ''))
                  details.append(
                      f'- **{severity} · `{rule}` · `{location}`** — {description}'
                      + (f'  \n  `{snippet[:300]}`' if snippet else '')
                  )

          lines = [
              '<!-- impeccable-exact-audit -->',
              '## Exact Impeccable audit',
              '',
              'Ran the current `impeccable@latest` detector against the PR documentation source and both required rendered viewports.',
              '',
              '| Pass | Exit | Primary | Advisory |',
              '|---|---:|---:|---:|',
          ]
          for label, status, primary, advisory in all_rows:
              lines.append(f'| {label} | {status} | {primary} | {advisory} |')
          lines.extend(['', '### Findings', ''])
          lines.extend(details or ['No findings.'])
          lines.extend(['', f'**Verdict: {"HOLD" if overall_failed else "PASS"}.**'])

          Path('/tmp/impeccable-summary.md').write_text('\n'.join(lines) + '\n')
          Path('/tmp/impeccable-result').write_text('failure' if overall_failed else 'success')
          PY

      - name: Publish exact audit summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: gh pr comment "$PR_NUMBER" --body-file /tmp/impeccable-summary.md

      - name: Enforce exact audit result
        shell: bash
        run: |
          test "$(cat /tmp/impeccable-result)" = success

      - name: Stop documentation server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/design-studio-docs.pid ]; then
            kill "$(cat /tmp/design-studio-docs.pid)" 2>/dev/null || true
          fi
