name: Apply review fixes and audit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json

      - name: Apply review corrections
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .review-fixes.patch
          git apply .review-fixes.patch
          rm .review-fixes.patch

      - name: Validate workflow and eval contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import yaml

          root = Path('.')
          plugin = json.loads((root / '.claude-plugin/plugin.json').read_text())
          evals = json.loads((root / 'skills/design-studio/evals/evals.json').read_text())
          skill = (root / 'skills/design-studio/SKILL.md').read_text()
          workflow_text = (root / 'skills/design-studio/workflow.yaml').read_text()
          yaml.safe_load(workflow_text)

          skill_version = re.search(r'^version:\s*([^\s]+)', skill, re.M).group(1)
          workflow_version = re.search(r'^\s{2}version:\s*([^\s]+)', workflow_text, re.M).group(1)
          versions = {plugin['version'], evals['version'], skill_version, workflow_version}
          if versions != {'1.4.0'}:
              raise SystemExit(f'version mismatch: {versions}')
          if len(evals.get('evals', [])) != 16:
              raise SystemExit(f"expected 16 evals, found {len(evals.get('evals', []))}")

          required_phrases = [
              'the user explicitly requested unattended or no-question execution',
              'Never ask a question after an explicit unattended or no-question request',
              'Never accept corrected-site solely because its directory exists',
              'Never choose corrected-site from directory existence alone',
              'selectedTree: selected-site',
          ]
          missing = [phrase for phrase in required_phrases if phrase not in workflow_text]
          if missing:
              raise SystemExit(f'missing workflow correction contract: {missing}')

          html = (root / 'docs/index.html').read_text()
          if '@media (max-width: 1200px)' not in html:
              raise SystemExit('intermediate-width hero breakpoint correction is missing')
          if 'status-pulse' in html:
              raise SystemExit('decorative infinite pulse remains')
          if 'font: 10px' in html:
              raise SystemExit('undersized 10px UI text remains')
          PY

      - name: Start documentation server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs > /tmp/design-studio-docs.log 2>&1 &
          echo $! > /tmp/design-studio-docs.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/design-studio-docs.log
          exit 1

      - name: Run exact Impeccable source and viewport scans
        shell: bash
        run: |
          set -uo pipefail
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome_path" ]; then
            export PUPPETEER_EXECUTABLE_PATH="$chrome_path"
          fi

          mkdir -p .impeccable-audit
          set +e
          npx -y impeccable@latest detect --json docs/index.html > .impeccable-audit/source.json
          source_status=$?
          npx -y impeccable@latest detect --json --viewport 1440x900 http://127.0.0.1:4173/ > .impeccable-audit/desktop-1440x900.json
          desktop_status=$?
          npx -y impeccable@latest detect --json --viewport 1150x900 http://127.0.0.1:4173/ > .impeccable-audit/intermediate-1150x900.json
          intermediate_status=$?
          npx -y impeccable@latest detect --json --viewport 390x844 http://127.0.0.1:4173/ > .impeccable-audit/mobile-390x844.json
          mobile_status=$?
          set -e

          python - "$source_status" "$desktop_status" "$intermediate_status" "$mobile_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          labels = ['source', 'desktop-1440x900', 'intermediate-1150x900', 'mobile-390x844']
          statuses = dict(zip(labels, map(int, sys.argv[1:])))
          lines = ['# Exact Impeccable audit', '', '| Pass | Exit | Primary | Advisory |', '|---|---:|---:|---:|']
          overall_failed = False

          for label, status in statuses.items():
              path = Path('.impeccable-audit') / f'{label}.json'
              try:
                  findings = json.loads(path.read_text())
                  if not isinstance(findings, list):
                      raise TypeError(f'expected array, got {type(findings).__name__}')
              except Exception as exc:
                  findings = []
                  overall_failed = True
                  lines.append(f'| {label} | {status} | parse error: {exc} | — |')
                  continue

              def advisory(finding):
                  return finding.get('advisory') is True or finding.get('severity') == 'advisory'

              primary = [finding for finding in findings if not advisory(finding)]
              advisories = [finding for finding in findings if advisory(finding)]
              lines.append(f'| {label} | {status} | {len(primary)} | {len(advisories)} |')
              if primary:
                  overall_failed = True

          lines.extend(['', f'**Verdict: {"HOLD" if overall_failed else "PASS"}.**', ''])
          Path('.impeccable-audit/summary.md').write_text('\n'.join(lines))
          Path('/tmp/impeccable-result').write_text('failure' if overall_failed else 'success')
          PY

      - name: Commit corrected files and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address design workflow review findings'
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

      - name: Enforce exact audit result
        shell: bash
        run: test "$(cat /tmp/impeccable-result)" = success

      - name: Stop documentation server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/design-studio-docs.pid ]; then
            kill "$(cat /tmp/design-studio-docs.pid)" 2>/dev/null || true
          fi
