name: Impeccable exact audit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  impeccable:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json

      - name: Start documentation server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs > /tmp/design-studio-docs.log 2>&1 &
          echo $! > /tmp/design-studio-docs.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/design-studio-docs.log
          exit 1

      - name: Run exact Impeccable source and viewport scans
        shell: bash
        run: |
          set -uo pipefail
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome_path" ]; then
            export PUPPETEER_EXECUTABLE_PATH="$chrome_path"
          fi

          set +e
          npx -y impeccable@latest detect --json docs/index.html > /tmp/impeccable-source.json
          source_status=$?
          npx -y impeccable@latest detect --json --viewport 1440x900 http://127.0.0.1:4173/ > /tmp/impeccable-desktop.json
          desktop_status=$?
          npx -y impeccable@latest detect --json --viewport 390x844 http://127.0.0.1:4173/ > /tmp/impeccable-mobile.json
          mobile_status=$?
          set -e

          mkdir -p .impeccable-audit
          cp /tmp/impeccable-source.json .impeccable-audit/source.json
          cp /tmp/impeccable-desktop.json .impeccable-audit/desktop-1440x900.json
          cp /tmp/impeccable-mobile.json .impeccable-audit/mobile-390x844.json

          python - "$source_status" "$desktop_status" "$mobile_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          statuses = {
              'source': int(sys.argv[1]),
              'desktop-1440x900': int(sys.argv[2]),
              'mobile-390x844': int(sys.argv[3]),
          }
          lines = ['# Exact Impeccable audit', '', '| Pass | Exit | Primary | Advisory |', '|---|---:|---:|---:|']
          overall_failed = False
          for label, status in statuses.items():
              path = Path('.impeccable-audit') / f'{label}.json'
              try:
                  findings = json.loads(path.read_text())
                  if not isinstance(findings, list):
                      raise TypeError(f'expected array, got {type(findings).__name__}')
              except Exception as exc:
                  findings = []
                  overall_failed = True
                  lines.append(f'| {label} | {status} | parse error: {exc} | — |')
                  continue
              primary = sum(not finding.get('advisory') for finding in findings)
              advisory = sum(bool(finding.get('advisory')) for finding in findings)
              lines.append(f'| {label} | {status} | {primary} | {advisory} |')
              overall_failed = overall_failed or status != 0 or primary > 0
          lines.extend(['', f'**Verdict: {"HOLD" if overall_failed else "PASS"}.**', ''])
          Path('.impeccable-audit/summary.md').write_text('\n'.join(lines))
          PY

      - name: Commit exact audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .impeccable-audit
          git commit -m 'chore: record exact Impeccable audit'
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

      - name: Stop documentation server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/design-studio-docs.pid ]; then
            kill "$(cat /tmp/design-studio-docs.pid)" 2>/dev/null || true
          fi
