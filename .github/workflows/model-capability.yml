name: Validate historical GitHub Models evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/probe_github_models.py"
      - "test/test_github_models_capability.py"
      - "benchmarks/milestone-0/MODEL_HARNESS.md"
      - "benchmarks/milestone-0/evidence/github-models-capability.json"
      - ".github/workflows/model-capability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-capability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve historical probe contracts
        run: python3 -m unittest discover -s test -p 'test_github_models_capability.py'

      - name: Validate permanent historical receipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          receipt = json.loads(
              (root / 'benchmarks/milestone-0/evidence/github-models-capability.json').read_text()
          )
          if receipt.get('schemaVersion') != 1 or receipt.get('status') != 'passed':
              raise SystemExit('historical GitHub Models receipt must remain a passed schemaVersion 1 record')
          if receipt.get('workflow', {}).get('runId') != 30556498881:
              raise SystemExit('historical GitHub Models run provenance changed')
          checks = receipt.get('probe', {}).get('checks', {})
          for name in ('catalog', 'structuredText', 'vision'):
              if checks.get(name, {}).get('status') != 'passed':
                  raise SystemExit(f'historical GitHub Models {name} evidence is not passed')
          document = (root / 'benchmarks/milestone-0/MODEL_HARNESS.md').read_text()
          required = (
              'Historical evidence; the execution surface is retired',
              'fully retired GitHub Models on July 30, 2026',
              'Copilot CLI agent gate',
          )
          missing = [marker for marker in required if marker not in document]
          if missing:
              raise SystemExit(f'historical model documentation is incomplete: {missing}')
          PY
