name: Validate runtime portability

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'skills/design-studio/SKILL.md'
      - 'skills/design-studio/workflow.yaml'
      - 'skills/design-studio/runtime-contract.md'
      - 'skills/design-studio/runtime/**'
      - 'skills/design-studio/references/quality-gates.md'
      - 'skills/design-studio/references/document/**'
      - 'test/test_runtime_contract.py'
      - 'test/test_mechanical_runtime.mjs'
      - 'test/test_document_artifact_lane.py'
      - '.github/workflows/runtime-portability.yml'
  push:
    branches: [main]
    paths:
      - 'skills/design-studio/SKILL.md'
      - 'skills/design-studio/workflow.yaml'
      - 'skills/design-studio/runtime-contract.md'
      - 'skills/design-studio/runtime/**'
      - 'skills/design-studio/references/quality-gates.md'
      - 'skills/design-studio/references/document/**'
      - 'test/test_runtime_contract.py'
      - 'test/test_mechanical_runtime.mjs'
      - 'test/test_document_artifact_lane.py'
      - '.github/workflows/runtime-portability.yml'

permissions:
  contents: read

jobs:
  mechanical-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate runtime seam contract
        run: python -m unittest discover -s test -p test_runtime_contract.py -v

      - name: Validate mechanical runtime behavior
        run: node --test test/test_mechanical_runtime.mjs

      - name: Validate document runtime behavior
        run: python -m unittest discover -s test -p test_document_artifact_lane.py -v
