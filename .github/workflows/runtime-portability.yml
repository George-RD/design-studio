name: Validate runtime portability

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'skills/design-studio/**'
      - 'commands/**'
      - 'test/**'
      - 'ROADMAP.md'
      - 'docs/agents/**'
      - 'docs/decisions/**'
      - '.github/workflows/runtime-portability.yml'
  push:
    branches: [main]
    paths:
      - 'skills/design-studio/**'
      - 'commands/**'
      - 'test/**'
      - 'ROADMAP.md'
      - 'docs/agents/**'
      - 'docs/decisions/**'
      - '.github/workflows/runtime-portability.yml'

permissions:
  contents: read

jobs:
  mechanical-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Design Intent runtime behavior
        run: python -m unittest discover -s test -p 'test_design_intent*.py' -v

      - name: Validate runtime seam contract
        run: python -m unittest discover -s test -p test_runtime_contract.py -v

      - name: Validate mechanical runtime behavior
        run: node --test test/test_mechanical_runtime.mjs

      - name: Validate document runtime behavior
        run: python -m unittest discover -s test -p test_document_artifact_lane.py -v

      - name: Validate portable design authority and consumer parity
        run: python -m unittest discover -s test -p test_design_authority_profile.py -v

      - name: Validate accepted design-system lifecycle
        run: python -m unittest discover -s test -p test_system_lifecycle.py -v
