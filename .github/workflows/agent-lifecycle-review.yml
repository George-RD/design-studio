name: Agent lifecycle review transfer (temporary)
on:
  push:
    branches: [agent/93-design-system-lifecycle]
    paths: [.github/workflows/agent-lifecycle-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/93-design-system-lifecycle
      - name: Apply exact tested review fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = Path('.agent-lifecycle-review-patch.b64').read_text()
          Path('/tmp/lifecycle-review.patch').write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          PY
          git apply --index /tmp/lifecycle-review.patch
          git rm .agent-lifecycle-review-patch.b64
          git rm --cached .github/workflows/agent-lifecycle-review.yml
          test "$(git write-tree)" = ee348066a0258a6cc71deccdb6018a5fb7ed969b
          git add .github/workflows/agent-lifecycle-review.yml
          git diff --cached --check
          git config user.name "George"
          git config user.email "180932462+George-RD@users.noreply.github.com"
          git commit -m "Fix lifecycle proof, Document token continuity and UTF-8 review findings"
          git push origin HEAD:agent/93-design-system-lifecycle
