name: Validate Design Studio

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate contracts and copy
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file("skills/design-studio/workflow.yaml"))' > /tmp/workflow.json
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          root = Path('.')
          plugin = json.loads((root / '.claude-plugin/plugin.json').read_text())
          marketplace = json.loads((root / '.claude-plugin/marketplace.json').read_text())
          evals = json.loads((root / 'skills/design-studio/evals/evals.json').read_text())
          workflow = json.loads(Path('/tmp/workflow.json').read_text())['workflow']
          skill = (root / 'skills/design-studio/SKILL.md').read_text()
          skill_version = re.search(r'^version:\s*([^\s]+)', skill, re.M).group(1)

          marketplace_plugin = next(p for p in marketplace['plugins'] if p['name'] == 'design-studio')
          versions = {
              plugin['version'],
              marketplace_plugin['version'],
              skill_version,
          }
          if versions != {'1.7.0'}:
              raise SystemExit(f'version mismatch: {versions}')

          ids = [step['id'] for step in workflow['steps']]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate workflow step id')
          known = set(ids)
          terminal = {'complete', 'halted'}
          missing = []
          for step in workflow['steps']:
              for key in ('next', 'otherwise'):
                  target = step.get(key)
                  if target and target not in known and target not in terminal:
                      missing.append((step['id'], key, target))
              for target in (step.get('transitions') or {}).values():
                  if target not in known and target not in terminal:
                      missing.append((step['id'], 'transition', target))
              for branch in step.get('branches') or []:
                  target = branch.get('next')
                  if target and target not in known and target not in terminal:
                      missing.append((step['id'], 'branch', target))
          if missing:
              raise SystemExit(f'unknown workflow targets: {missing}')

          required_steps = {
              'resolve_roots',
              'probe_capabilities',
              'prepare_direction_assignment',
              'prepare_refine_iteration',
              'prepare_pivot_iteration',
              'finish_correction_decide',
              'accept',
          }
          if not required_steps.issubset(known):
              raise SystemExit(f'missing workflow steps: {sorted(required_steps - known)}')

          order = {step_id: index for index, step_id in enumerate(ids)}
          if order['prepare_direction_assignment'] > order['explore_direction']:
              raise SystemExit('unattended direction assignment must precede candidate generation')
          if order['accept'] > order['codify']:
              raise SystemExit('acceptance receipt must precede codify')

          required_paths = {'roots', 'capabilities', 'events', 'directionAssignment', 'finishAcceptance'}
          absent_paths = required_paths - set(workflow.get('paths', {}))
          if absent_paths:
              raise SystemExit(f'missing workflow paths: {sorted(absent_paths)}')

          if len(evals.get('evals', [])) < 29:
              raise SystemExit('expected at least 29 design-studio evals')

          required_refs = [
              'skills/design-studio/invocation.md',
              'skills/design-studio/references/runtime-integrity.md',
              'skills/design-studio/references/copy.md',
              'skills/design-studio/references/quality-gates.md',
              'skills/design-studio/agents/design-agent.md',
          ]
          missing_refs = [path for path in required_refs if not (root / path).is_file()]
          if missing_refs:
              raise SystemExit(f'missing focused references: {missing_refs}')

          html = (root / 'docs/index.html').read_text()
          required_html = [
              'role="group" aria-label="Design Studio run board"',
              'role="img" aria-label="Four preserved iterations',
              'aria-label="Copy Design Studio create command"',
              'npx skills add George-RD/design-studio',
              '/plugin marketplace add George-RD/design-studio',
              '/plugin install design-studio@design-studio',
              'data-handoff-demo',
              'aria-label="Pause workflow animation"',
              'href="styles.css"',
              'src="app.js"',
          ]
          absent = [marker for marker in required_html if marker not in html]
          if absent:
              raise SystemExit(f'missing documentation contract: {absent}')

          forbidden = [
              'status-pulse',
              'font: 10px',
              'claude plugin install https://github.com/George-RD/design-studio',
              'video-1080p.gif',
              '<video',
              'remotion-video',
          ]
          present = [marker for marker in forbidden if marker in html.lower()]
          if present:
              raise SystemExit(f'forbidden documentation pattern remains: {present}')

          if (root / 'docs/video-1080p.gif').exists() or (root / 'remotion-video').exists():
              raise SystemExit('obsolete video assets or Remotion toolchain remain')

          for asset in ('docs/readme-banner.svg', 'docs/readme-flow.svg'):
              text = (root / asset).read_text()
              if '<svg' not in text or 'prefers-reduced-motion' not in text:
                  raise SystemExit(f'{asset} must remain a useful static SVG with reduced-motion-aware animation')

          readme = (root / 'README.md').read_text()
          if len(readme.splitlines()) > 130:
              raise SystemExit('README exceeded the concise 130-line budget')
          required_readme = [
              'npx skills add George-RD/design-studio',
              '/plugin marketplace add George-RD/design-studio',
              '/plugin install design-studio@design-studio',
          ]
          absent_readme = [marker for marker in required_readme if marker not in readme]
          if absent_readme:
              raise SystemExit(f'missing README install contract: {absent_readme}')
          for asset in ('docs/readme-banner.svg', 'docs/readme-flow.svg'):
              if asset not in readme:
                  raise SystemExit(f'README does not use {asset}')

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'script', 'style'}:
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script', 'style'} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          parser = VisibleText()
          parser.feed(html)
          public_copy = ' '.join(parser.parts)
          readme_copy = re.sub(r'```.*?```', ' ', readme, flags=re.S)
          readme_copy = re.sub(r'`[^`]*`', ' ', readme_copy)
          readme_copy = re.sub(r'<[^>]+>', ' ', readme_copy)
          public_copy += ' ' + readme_copy
          public_copy = re.sub(r'\s+', ' ', public_copy).lower()

          tier1 = {
              'delve', 'landscape', 'tapestry', 'paradigm', 'leverage', 'harness',
              'navigate', 'realm', 'embark', 'journey', 'myriad', 'plethora',
              'multifaceted', 'revolutionize', 'synergy', 'ecosystem', 'resonate',
              'streamline',
          }
          found = sorted(word for word in tier1 if re.search(rf'\b{re.escape(word)}(?:s|d|ed|ing)?\b', public_copy))
          if found:
              raise SystemExit(f'Growth Arsenal Tier-1 copy terms remain in public prose: {found}')
          if '—' in public_copy:
              raise SystemExit('public copy contains an em dash')
          for phrase in ('not just ', 'in today\'s fast-paced', 'game-changing', 'unlock the power'):
              if phrase in public_copy:
                  raise SystemExit(f'formulaic public-copy phrase remains: {phrase}')

          css_paths = [root / 'docs/styles.css', root / 'docs/styles-base.css', root / 'docs/styles-workflow.css', root / 'docs/styles-responsive.css']
          missing_css = [str(path) for path in css_paths if not path.is_file()]
          if missing_css:
              raise SystemExit(f'missing documentation styles: {missing_css}')
          css = '\n'.join(path.read_text() for path in css_paths)
          stylesheet = (root / 'docs/styles.css').read_text()
          for marker in ('styles-base.css', 'styles-workflow.css', 'styles-responsive.css'):
              if marker not in stylesheet:
                  raise SystemExit(f'missing stylesheet import: {marker}')
          app_js = (root / 'docs/app.js').read_text()
          for marker in ('@media (max-width: 1200px)', '@media (prefers-reduced-motion: reduce)'):
              if marker not in css:
                  raise SystemExit(f'missing responsive CSS contract: {marker}')
          for marker in ("if (!document.execCommand('copy'))", "'Play workflow animation'"):
              if marker not in app_js:
                  raise SystemExit(f'missing documentation script contract: {marker}')
          if '<style>' in html or '<script>' in html:
              raise SystemExit('docs CSS and JS must stay in maintainable external files')
          PY
          node --check docs/app.js

      - name: Validate clean Agent Skill install contract
        shell: bash
        run: python3 -m unittest discover -s test -p 'test_clean_install_contract.py' -v

      - name: Validate engineering skill ownership
        shell: bash
        run: python3 -m unittest discover -s test -p 'test_engineering_skill_management.py' -v

      - name: Start documentation server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs > /tmp/design-studio-docs.log 2>&1 &
          echo $! > /tmp/design-studio-docs.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/design-studio-docs.log
          exit 1

      - name: Install pinned Impeccable
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/impeccable --ignore-scripts --no-audit --no-fund impeccable@3.5.0
          test -x /tmp/impeccable/node_modules/.bin/impeccable

      - name: Run exact Impeccable scans
        shell: bash
        run: |
          set -uo pipefail
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome_path" ]; then
            export PUPPETEER_EXECUTABLE_PATH="$chrome_path"
          fi

          detector=/tmp/impeccable/node_modules/.bin/impeccable
          mkdir -p .impeccable-audit
          set +e
          "$detector" detect --json docs/index.html > .impeccable-audit/source.json
          source_status=$?
          "$detector" detect --json --viewport 1440x900 http://127.0.0.1:4173/ > .impeccable-audit/desktop-1440x900.json
          desktop_status=$?
          "$detector" detect --json --viewport 1150x900 http://127.0.0.1:4173/ > .impeccable-audit/intermediate-1150x900.json
          intermediate_status=$?
          "$detector" detect --json --viewport 390x844 http://127.0.0.1:4173/ > .impeccable-audit/mobile-390x844.json
          mobile_status=$?
          set -e

          python3 - "$source_status" "$desktop_status" "$intermediate_status" "$mobile_status" <<'PY'
          from pathlib import Path
          import json
          import sys

          labels = ['source', 'desktop-1440x900', 'intermediate-1150x900', 'mobile-390x844']
          statuses = dict(zip(labels, map(int, sys.argv[1:])))
          lines = ['# Exact Impeccable audit', '', '| Pass | Exit | Primary | Advisory |', '|---|---:|---:|---:|']
          failed = False

          for label, status in statuses.items():
              path = Path('.impeccable-audit') / f'{label}.json'
              try:
                  findings = json.loads(path.read_text())
                  if not isinstance(findings, list):
                      raise TypeError(f'expected array, got {type(findings).__name__}')
                  if any(not isinstance(item, dict) for item in findings):
                      raise TypeError('every finding must be an object')
              except Exception as exc:
                  findings = []
                  failed = True
                  lines.append(f'| {label} | {status} | parse error | - |')
                  lines.append(f'<!-- {exc} -->')
                  continue

              advisories = [item for item in findings if item.get('severity') == 'advisory']
              primary = [item for item in findings if item.get('severity') != 'advisory']
              lines.append(f'| {label} | {status} | {len(primary)} | {len(advisories)} |')
              if status not in (0, 2) or primary:
                  failed = True

          lines.extend(['', f'**Verdict: {"HOLD" if failed else "PASS"}.**', ''])
          Path('.impeccable-audit/summary.md').write_text('\n'.join(lines))
          Path('/tmp/impeccable-result').write_text('failure' if failed else 'success')
          PY

      - name: Upload exact audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-audit
          path: .impeccable-audit/
          if-no-files-found: warn

      - name: Enforce exact audit result
        shell: bash
        run: test "$(cat /tmp/impeccable-result)" = success

      - name: Stop documentation server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/design-studio-docs.pid ]; then
            kill "$(cat /tmp/design-studio-docs.pid)" 2>/dev/null || true
          fi
