name: Agent lifecycle workspace (temporary)
on:
  push:
    branches: [agent/93-design-system-lifecycle]
    paths: [.github/workflows/agent-lifecycle-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar HEAD > /tmp/design-studio-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-source
          path: /tmp/design-studio-source.tar
          retention-days: 1
