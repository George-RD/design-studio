name: Agent lifecycle workspace (temporary)
on:
  push:
    branches: [agent/93-design-system-lifecycle]
    paths: [.github/workflows/agent-lifecycle-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/93-design-system-lifecycle
      - name: Apply exact tested lifecycle tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = ''.join(Path(f'.agent-lifecycle-patch-{n}.b64').read_text() for n in range(1, 5))
          Path('/tmp/lifecycle.patch').write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          PY
          git apply --index --unidiff-zero /tmp/lifecycle.patch
          git rm .github/workflows/agent-lifecycle-workspace.yml .agent-lifecycle-patch-{1,2,3,4}.b64
          test "$(git write-tree)" = aed40952273e7edf4e5ce60ec71b79f270b85050
          git diff --cached --check
          git config user.name "George"
          git config user.email "180932462+George-RD@users.noreply.github.com"
          git commit -m "Apply acceptance-controlled design-system lifecycle (#93)"
          git push origin HEAD:agent/93-design-system-lifecycle
