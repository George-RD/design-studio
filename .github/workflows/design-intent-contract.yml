name: Validate Design Intent contract

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-intent-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test-only contract validators
        run: python3 -m pip install -r test/requirements.txt

      - name: Validate Design Intent contract and workflow coverage
        run: |
          python3 -m unittest discover -s test -p 'test_design_intent*.py' -v
          python3 -m unittest discover -s test -p 'test_extend_workflow.py' -v
