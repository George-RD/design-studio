name: Export source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Package checked-out source
        run: git archive --format=tar.gz --output="${RUNNER_TEMP}/source-snapshot.tgz" HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/source-snapshot.tgz
          if-no-files-found: error
          retention-days: 1
