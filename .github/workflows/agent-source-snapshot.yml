name: Export agent source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agent-source-snapshot.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Create source archive
        run: >-
          tar
          --exclude=.git
          --exclude=design-studio-source.tgz
          -czf "${RUNNER_TEMP}/design-studio-source.tgz"
          .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: design-studio-source-${{ github.run_id }}
          path: ${{ runner.temp }}/design-studio-source.tgz
          if-no-files-found: error
          retention-days: 1
