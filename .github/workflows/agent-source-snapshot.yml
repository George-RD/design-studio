name: Temporary implementation source snapshot
on:
  push:
    branches: ['agent/92-portable-design-authority']
    paths: ['.github/workflows/agent-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bundle source history for isolated verification
        run: git bundle create /tmp/design-studio-source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: design-studio-source-bundle
          path: /tmp/design-studio-source.bundle
          retention-days: 1
