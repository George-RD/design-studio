name: Temporary extend implementation snapshot
on:
  push:
    branches: [agent/extend-workflow-91]
permissions:
  contents: write
concurrency:
  group: temporary-extend-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.repository == 'George-RD/design-studio' && github.ref == 'refs/heads/agent/extend-workflow-91'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore exact tested changes and remove temporary helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          chunks = [
              '8812d0b7e31a780e0203d83bd2ed2489c835229f',
              '631b2d4a8ea89224985ec8b097ae1d8e735edbaf',
              '319e42353971219941f25dc58f1239c9fb70864a',
              '1495527c0588449d2778044972c535a7646547cc',
          ]
          data = bytearray()
          for sha in chunks:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/George-RD/design-studio/git/blobs/{sha}',
                  headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              content = base64.b64decode(blob['content'])
              actual = hashlib.sha1(f'blob {len(content)}\0'.encode() + content).hexdigest()
              assert actual == sha, (actual, sha)
              data.extend(content)
          patch = lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '8c173acc13a94be5ff2f9f88c99a4afb76ac397bf91335b1c169857a11e3d479'
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'extend.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--exclude=.github/workflows/agent-source-snapshot.yml', str(patch_path)], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/agent-source-snapshot.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'e2985f23fa4d193831852b120b8c4e7cf4e84930', tree
          print('Verified exact locally tested tree:', tree)
          PY
      - name: Verify focused contracts without credentials in test environment
        run: |
          python3 - <<'PY'
          import unittest
          patterns = ['test_design_intent*.py', 'test_extend_workflow.py', 'test_method*.py', 'test_runtime_contract.py', 'test_document_artifact_lane.py', 'test_composition_contract.py', 'test_claude_adapter_compatibility.py', 'test_clean_install_contract.py', 'test_engineering_skill_management.py', 'test_public_source_install_contract.py', 'test_portable_product_migration_map.py', 'test_milestone_0_ownership_inventory.py', 'test_owned_method_kernel_direction.py', 'test_v17_release_contract.py', 'test_v17_release_closure.py']
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.discover('test', pattern=p) for p in patterns)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
          node --test test/test_mechanical_runtime.mjs
          git diff --cached --check
      - name: Upload verified blobs without changing any branch or commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'e2985f23fa4d193831852b120b8c4e7cf4e84930', tree
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM', '-z', 'HEAD']).decode().split('\0')
          entries = []
          for path in filter(None, paths):
              content = pathlib.Path(path).read_bytes()
              expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              payload = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/George-RD/design-studio/git/blobs',
                  data=payload, method='POST',
                  headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == expected, path
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': expected})
          removed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=D', '-z', 'HEAD']).decode().split('\0')
          entries.extend({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None} for path in filter(None, removed))
          result = {'expectedTree': tree, 'treeElements': entries}
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'extend-tree.json'
          output.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extend-tree
          path: ${{ runner.temp }}/extend-tree.json
          retention-days: 1
          if-no-files-found: error
