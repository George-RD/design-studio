name: Temporary verified implementation transfer
on:
  push:
    branches: ['agent/92-portable-design-authority']
    paths: ['.github/workflows/agent-apply-authority.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply integrity-checked implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == '9767ddd544ba0ef0e9f95bfb25086cf4fc6abe7f'
          def blob(sha):
              request = urllib.request.Request('https://api.github.com/repos/George-RD/design-studio/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return base64.b64decode(json.load(response)['content'])
          pieces = ['3b71c056dffcb936ab1ac1cbfe95691eb2afa314', 'fe1d120771f8d85729231c156500ef0fb4e31388', 'd9b31a77a32c4ee62b51f4382e395a52eebe9ff0', 'a93e9b19d1d23b326bd8a8dc7106ee16c9031162']
          patches = [(lzma.decompress(b''.join(blob(sha) for sha in pieces)), '9c3b98da91c411f4296f05aae7c0a9b71e1743fc671e8af0eaf7b27f786a1543'), (blob('d8189b2cbdefa993f3877b583245a6a51c744d76'), 'cf59a1e2e7390555e65487078f56a9fe0f126a4445093c8f2b0f7e57865226c8')]
          for index, (patch, digest) in enumerate(patches):
              assert hashlib.sha256(patch).hexdigest() == digest
              path = pathlib.Path('/tmp') / f'authority-{index}.patch'
              path.write_bytes(patch)
              subprocess.run(['git', 'apply', '--check', '--index', '--binary', str(path)], check=True)
              subprocess.run(['git', 'apply', '--index', '--binary', str(path)], check=True)
          transient = '.github/workflows/agent-apply-authority.yml'
          subprocess.run(['git', 'update-index', '--force-remove', transient], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '01a37e7e954c37c5bfa9420803859a112dc577b0'
          subprocess.run(['git', 'restore', '--staged', '--source=HEAD', '--', transient], check=True)
          PY
          git config user.name 'Design Studio implementation'
          git config user.email 'implementation@users.noreply.github.com'
          git commit -m 'feat: add portable DESIGN.md authority and deterministic consumer parity (#92)'
          git push origin HEAD:refs/heads/agent/92-portable-design-authority
