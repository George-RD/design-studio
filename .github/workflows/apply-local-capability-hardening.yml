name: Apply reviewed capability hardening

on:
  push:
    branches:
      - agent/m0-agent-runner-capability
    paths:
      - .github/workflows/apply-local-capability-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply test-first capability hardening
        env:
          TESTS_PATCH_GZIP_BASE64: 
          IMPLEMENTATION_PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          for name, variable in (
              ("tests", "TESTS_PATCH_GZIP_BASE64"),
              ("implementation", "IMPLEMENTATION_PATCH_GZIP_BASE64"),
          ):
              Path(f"/tmp/design-studio-{name}.patch").write_bytes(
                  gzip.decompress(base64.b64decode(os.environ[variable], validate=True))
              )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git apply --check /tmp/design-studio-tests.patch
          git apply /tmp/design-studio-tests.patch
          git add test/test_browser_capability_regressions.py test/test_copilot_cli_agent_capability.py
          git commit -m "test: harden browser capability evidence"

          git apply --check /tmp/design-studio-implementation.patch
          git apply /tmp/design-studio-implementation.patch
          git add scripts/run_browser_capability.mjs scripts/run_copilot_cli_agent_capability_gate.py
          git commit -m "fix: harden browser capability replay"

          git rm .github/workflows/apply-local-capability-hardening.yml
          git commit -m "chore: remove one-shot patch transport"
          git push origin "HEAD:${GITHUB_REF_NAME}"
