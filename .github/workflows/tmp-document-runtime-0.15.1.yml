name: Temporary document runtime export

on:
  push:
    branches:
      - agent/tmp-document-runtime-0.15.1

permissions:
  contents: read

jobs:
  export:
    name: Package Typst 0.15.1 and IBM Plex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xz-utils
      - name: Package pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/bin runtime/fonts /tmp/plex
          curl -fsSL \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            -o /tmp/typst.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst runtime/bin/typst
          test "$(runtime/bin/typst --version | awk '{print $2}')" = "0.15.1"

          curl -fsSL \
            https://github.com/IBM/plex/releases/download/v6.1.1/OpenType.zip \
            -o /tmp/ibm-plex-6.1.1-OpenType.zip
          unzip -q /tmp/ibm-plex-6.1.1-OpenType.zip -d /tmp/plex
          find /tmp/plex -type f \
            \( -iname 'IBMPlexSans-*.otf' -o -iname 'IBMPlexSansCondensed-*.otf' -o -iname 'IBMPlexMono-*.otf' \) \
            -exec cp '{}' runtime/fonts/ \;
          test "$(find runtime/fonts -type f | wc -l)" -gt 0
          find runtime/fonts -type f -iname 'IBMPlexSansCondensed-*.otf' | grep -q .
          runtime/bin/typst fonts --ignore-system-fonts --font-path runtime/fonts | tee runtime/FONT-FAMILIES.txt
          grep -Fx 'IBM Plex Sans' runtime/FONT-FAMILIES.txt
          grep -Fx 'IBM Plex Mono' runtime/FONT-FAMILIES.txt
          sha256sum /tmp/ibm-plex-6.1.1-OpenType.zip > runtime/FONT-ARCHIVE-SHA256
          sha256sum runtime/bin/typst runtime/fonts/* > runtime/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: horaxon-document-runtime-typst-0.15.1
          path: runtime
          if-no-files-found: error
          retention-days: 1
