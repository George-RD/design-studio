name: Impeccable diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start documentation server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs > /tmp/design-studio-docs.log 2>&1 &
          echo $! > /tmp/design-studio-docs.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/design-studio-docs.log
          exit 1

      - name: Install Impeccable
        run: npm install --prefix /tmp/impeccable --ignore-scripts --no-audit --no-fund impeccable@3.5.0

      - name: Run and print exact scans
        shell: bash
        run: |
          set -uo pipefail
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome_path" ]; then
            export PUPPETEER_EXECUTABLE_PATH="$chrome_path"
          fi
          detector=/tmp/impeccable/node_modules/.bin/impeccable
          mkdir -p impeccable-audit
          set +e
          "$detector" detect --json docs/index.html > impeccable-audit/source.json
          "$detector" detect --json --viewport 1440x900 http://127.0.0.1:4173/ > impeccable-audit/desktop-1440x900.json
          "$detector" detect --json --viewport 1150x900 http://127.0.0.1:4173/ > impeccable-audit/intermediate-1150x900.json
          "$detector" detect --json --viewport 390x844 http://127.0.0.1:4173/ > impeccable-audit/mobile-390x844.json
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in sorted(Path('impeccable-audit').glob('*.json')):
              print(f'\n## {path.name}')
              findings = json.loads(path.read_text())
              print(json.dumps(findings, indent=2))
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-diagnostics
          path: impeccable-audit/
          if-no-files-found: error

      - name: Stop documentation server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/design-studio-docs.pid ]; then
            kill "$(cat /tmp/design-studio-docs.pid)" 2>/dev/null || true
          fi
