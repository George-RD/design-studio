name: Temporary verified PR109 fixes
on:
  push:
    branches: ['agent/92-portable-design-authority']
    paths: ['.github/workflows/agent-pr109-fixes.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '371b3e780a65305f6c8325ec0c77fe3d3ae3a8e0'
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          payload = ''
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'cc4403ca2dafed339189c961aa6f0c72ad977f080311fd039eb626ca3276f058'
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero'], input=patch, check=True)
          expected = {
              'docs/method-authority-map.md': '6ba19abfc3d13d2dbf70227a97de54a77e2e94216a1747fc623756a5fc0b5e4c',
              'docs/migration-map.md': '8c63948f335d10263f5ebd0cbbcc7c12be3503ee7990fad96e4889358433581e',
              'skills/design-studio/runtime/design-authority/index.mjs': '599163460dda91ea7779295acd9406d6b7a3c5162817958df6e6886be7f3a0ff',
              'skills/design-studio/workflow.yaml': '8193908c402a3fa71373bb92d36bd2dc6cbdcd2782e5ef85723eada1e0d2c4b6',
              'test/test_design_authority_contract.py': '7b8e1af66e1a752393f64993bad44da9ec1d9341e81e5f4a1c07fd2578be3385',
              'test/test_design_authority_profile.py': '2b57d4589fd7108eefdc9c0cf02384610737ad9651bcd93d8ba5f94c43662035',
          }
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, path
          subprocess.run(['git', 'add', '--', *expected], check=True)
          PY
          git rm -- .github/workflows/agent-pr109-fixes.yml
          git diff --cached --check
      - name: Verify public runtime and workflow contracts
        run: |
          python -m pip install -r test/requirements.txt
          python -m unittest discover -s test -p 'test_design_authority*.py' -v
          node --test test/test_mechanical_runtime.mjs
      - name: Commit only the reviewed branch changes
        run: |
          git -c user.name='George' -c user.email='180932462+George-RD@users.noreply.github.com' commit -m 'fix: close portable authority validation and codification gaps'
          git push origin HEAD:refs/heads/agent/92-portable-design-authority
