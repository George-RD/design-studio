name: Temporary verified PR109 fixes
on:
  push:
    branches: ['agent/92-portable-design-authority']
    paths: ['.github/workflows/agent-pr109-fixes.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact locally reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b77fdfa61772d925fb07da0373ac31326ec06b03'
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          payload = ''
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '226207cf593bc027bb329023732d2bade4fde0e0413655dbba8cc41bb2119e90'
          path = pathlib.Path('/tmp/pr109-reviewed.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(path)], check=True)
          PY
      - name: Verify public authority seam and workflow contracts
        run: |
          python -m pip install -r test/requirements.txt
          node --check skills/design-studio/runtime/design-authority/index.mjs
          python -B -m unittest discover -s test -p 'test_design_authority_*.py' -v
          node --test test/test_mechanical_runtime.mjs
          git diff --check
      - name: Commit verified fixes and remove this transfer workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-pr109-fixes.yml
          git add skills/design-studio/assets/design-system-skill/README.md skills/design-studio/references/design-authority/profile.md skills/design-studio/runtime/design-authority/index.mjs skills/design-studio/workflow.yaml test/test_design_authority_contract.py test/test_design_authority_profile.py
          test "$(git write-tree)" = '8e98dfddee39f86004b5edff7f0496e54e11915a'
          git config user.name 'George'
          git config user.email '180932462+George-RD@users.noreply.github.com'
          git commit -m 'fix: stage authority publication and reject hidden or remote token evidence'
          git push origin HEAD:agent/92-portable-design-authority
