name: Apply PR 33 follow-up

on:
  push:
    branches:
      - agent/m0-agent-runner-capability
    paths:
      - ".github/workflows/apply-pr33-followup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out staged patch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply regression tests first
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --check .github/patches/pr33-followup-tests.patch
          git apply .github/patches/pr33-followup-tests.patch
          git add \
            test/test_browser_capability_regressions.py \
            test/test_browser_motion_evidence.mjs \
            test/test_copilot_cli_agent_capability.py
          git commit -m "test: cover capability gate follow-up regressions"

      - name: Apply implementation and remove staging files
        run: |
          set -euo pipefail
          git apply --check .github/patches/pr33-followup-implementation.patch
          git apply .github/patches/pr33-followup-implementation.patch
          rm -f \
            .github/patches/pr33-followup-tests.patch \
            .github/patches/pr33-followup-implementation.patch \
            .github/workflows/apply-pr33-followup.yml
          git add -A
          git commit -m "fix: harden the comparison capability gate"

      - name: Push ordered commits
        run: git push origin HEAD:agent/m0-agent-runner-capability

# Triggered after registration so the branch-local workflow is active.
