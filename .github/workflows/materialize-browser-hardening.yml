name: Materialize browser hardening

on:
  push:
    branches:
      - agent/m0-agent-capability-hardening
    paths:
      - .github/workflows/materialize-browser-hardening.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Materialize verified browser probe
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = """"""
          content = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(content).hexdigest()
          expected = "04f45029eb7fd0b287d773d38999e641fc8dc04ec0ad793b5a78f039f96beb82"
          if digest != expected:
              raise SystemExit(f"unexpected browser probe digest: {digest}")
          Path("scripts/run_browser_capability.mjs").write_bytes(content)
          PY
          node --check scripts/run_browser_capability.mjs
          test "$(sha256sum scripts/run_browser_capability.mjs | cut -d' ' -f1)" = "04f45029eb7fd0b287d773d38999e641fc8dc04ec0ad793b5a78f039f96beb82"
      - name: Commit verified browser probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_browser_capability.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: harden browser capability probe"
          git push origin HEAD:${GITHUB_REF_NAME}
