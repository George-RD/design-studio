name: Validate benchmark fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/milestone-0/**"
      - "scripts/validate_benchmark_fixtures.py"
      - "test/test_benchmark_fixtures.py"
      - ".github/workflows/benchmark-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/milestone-0/**"
      - "scripts/validate_benchmark_fixtures.py"
      - "test/test_benchmark_fixtures.py"
      - ".github/workflows/benchmark-fixtures.yml"

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate frozen fixtures
        run: python3 -m unittest test/test_benchmark_fixtures.py
