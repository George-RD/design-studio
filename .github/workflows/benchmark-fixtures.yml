name: Validate benchmark fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/milestone-0/**"
      - "scripts/validate_benchmark_fixtures.py"
      - "scripts/run_boundary_benchmark.py"
      - "test/test_benchmark_fixtures.py"
      - "test/test_boundary_benchmark_run.py"
      - ".github/workflows/benchmark-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/milestone-0/**"
      - "scripts/validate_benchmark_fixtures.py"
      - "scripts/run_boundary_benchmark.py"
      - "test/test_benchmark_fixtures.py"
      - "test/test_boundary_benchmark_run.py"
      - ".github/workflows/benchmark-fixtures.yml"

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate frozen fixtures and run lifecycle
        run: python3 -m unittest discover -s test -p 'test_*benchmark*.py'
